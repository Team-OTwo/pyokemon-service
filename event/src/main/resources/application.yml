server:
  port: 8081
  servlet:
    context-path: /event

spring:
  application:
    name: event-service
  profiles:
    include:
      - flyway
      - common
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3307/pyokemon_event?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: pyokemon_event
    password: pyokemon123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    locations: classpath:db/migration/event

  kafka:
    consumer:
      group-id: ${spring.application.name}

# 앱 설정
app:
  upload:
    path: event/uploads
    url-prefix: /uploads
  server:
    base-url: http://localhost:8081

mybatis:
  mapper-locations: classpath:mapper/*.xml

---
spring:
  config:
    activate:
      on-profile: "dev"
    import:
      - classpath:dev-config.yml
