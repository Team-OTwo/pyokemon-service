server:
  port: 8081
  servlet:
    context-path: /event

spring:
  application:
    name: event-service
  profiles:
    include:
      - flyway
      - common
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3307/pyokemon_event?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: pyokemon_event
    password: pyokemon123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    locations: classpath:db/migration/event

  kafka:
    consumer:
      group-id: ${spring.application.name}

mybatis:
  mapper-locations: classpath:mapper/*.xml

# 파일 업로드 설정
app:
  upload:
    path: event/uploads
    url-prefix: /uploads
  # S3 설정 (선택사항 - 나중에 S3로 전환 시 사용)
  # storage:
  #   type: s3  # local 또는 s3
  # s3:
  #   bucket-name: your-bucket-name
  #   region: ap-northeast-2
  #   url-prefix: https://your-bucket.s3.amazonaws.com

---
spring:
  config:
    activate:
      on-profile: "dev"
    import:
      - classpath:dev-config.yml
