spring:
  datasource:
    url: jdbc:mysql://pyokemon-did-mysql:3306/pyokemon_did?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

  flyway:
    locations: classpath:db/migration/did
    repair-on-migrate: true

    # Kafka 설정 (Docker 환경)
  kafka:
    bootstrap-servers: pyokemon-kafka:9092
    consumer:
      group-id: did-service
    producer:
      bootstrap-servers: pyokemon-kafka:9092

# Booking 서비스 설정
booking:
  service:
    base-url: http://pyokemon-booking-service:8088/booking

# ACA-Py 설정
acapy:
  tenant:
    base-url: http://pyokemon-tenant-aca-py-main-tenant-1:8003  # pyokemon-booking-ACA-Py
    wallet-id: tenant-wallet
  user:
    base-url: http://pyokemon-user-aca-py-main-user-1:8002  # pyokemon-user-ACA-Py
    wallet-id: user-wallet
  mediator:
    base-url: http://pyokemon-mediator-aca-py-mediator-1:8001  # pyokemon-mediator-ACA-Py (admin port)
    api-key: secure-key  # Docker 환경변수 ADMIN_API_KEY와 동일
    wallet-id: mediator-wallet
  wallet:
    key: MySecretKey123  # Wallet 생성용 키
  webhook:
    base-url: http://pyokemon-did-service:8084/did/webhooks
    topic-prefix: /topic/