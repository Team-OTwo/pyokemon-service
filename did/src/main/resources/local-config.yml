spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pyokemon_did?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

  flyway:
    locations: classpath:db/migration/did
    repair-on-migrate: true
    
  # Kafka 설정 (로컬 환경)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: did-service
    producer:
      bootstrap-servers: localhost:9092

  # Redis 설정 (로컬 환경)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Booking 서비스 설정 (로컬 환경)
booking:
  service:
    base-url: http://localhost:8088/booking

# ACA-Py 설정 (로컬 환경)
acapy:
  tenant:
    base-url: http://localhost:8003  # pyokemon-tenant-ACA-Py
    wallet-id: tenant-wallet
  user:
    base-url: http://localhost:8002  # pyokemon-user-ACA-Py
    wallet-id: user-wallet
  mediator:
    base-url: http://localhost:8001  # pyokemon-mediator-ACA-Py (admin port)
    api-key: secure-key  # Docker 환경변수 ADMIN_API_KEY와 동일
    wallet-id: mediator-wallet
  wallet:
    key: MySecretKey123  # Wallet 생성용 키

# Swagger 설정 (로컬 환경)
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
